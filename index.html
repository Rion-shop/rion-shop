<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Rion Shop</title>  <style> *{     margin:0;     padding:0;     box-sizing:border-box;     font-family:Arial,sans-serif; }  body{     background:#f5f5f5;     color:#222; }  /* NAVBAR */ nav{     background:#111;     color:white;     padding:18px 7%;     display:flex;     align-items:center;     justify-content:space-between;     position:sticky;     top:0;     z-index:100; }  .logo{     font-size:27px;     font-weight:bold; }  .logo span{     color:#ff3b81; }  nav a{     color:white;     text-decoration:none;     margin-left:20px; }  /* HERO */ .hero{     padding:90px 7%;     text-align:center;     background:linear-gradient(135deg,#171717,#ff3b81);     color:white; }  .hero h1{     font-size:55px;     margin-bottom:15px; }  .hero p{     font-size:18px;     margin-bottom:30px; }  .btn{     border:0;     background:#ff3b81;     color:white;     padding:13px 25px;     border-radius:25px;     cursor:pointer;     font-weight:bold; }  .hero .btn{     background:white;     color:#ff3b81; }  /* SEARCH */ .search-area{     padding:35px 7%;     text-align:center; }  #search{     width:90%;     max-width:600px;     padding:15px;     border:1px solid #ddd;     border-radius:30px;     outline:none;     font-size:16px; }  /* CATEGORY */ .categories{     text-align:center;     padding:10px; }  .categories button{     padding:10px 20px;     margin:5px;     border:0;     border-radius:20px;     background:#222;     color:white;     cursor:pointer; }  .categories button:hover{     background:#ff3b81; }  /* PRODUCTS */ .products{     padding:40px 7%; }  .products h2{     text-align:center;     margin-bottom:35px;     font-size:35px; }  .product-grid{     display:grid;     grid-template-columns:repeat(4,1fr);     gap:25px; }  .product{     background:white;     border-radius:15px;     overflow:hidden;     box-shadow:0 4px 15px rgba(0,0,0,.08);     transition:.3s; }  .product:hover{     transform:translateY(-7px); }  .product-img{     height:220px;     background:#eee;     display:flex;     align-items:center;     justify-content:center;     font-size:70px; }  .product-info{     padding:20px; }  .product-info h3{     margin-bottom:10px; }  .price{     color:#ff3b81;     font-size:21px;     font-weight:bold;     margin-bottom:15px; }  .product button{     width:100%; }  /* CART */ .cart{     background:#111;     color:white;     padding:45px 7%;     text-align:center; }  .cart h2{     margin-bottom:15px; }  #cartCount{     color:#ff3b81; }  /* FOOTER */ footer{     background:#050505;     color:#aaa;     text-align:center;     padding:30px; }  /* MOBILE */ @media(max-width:900px){     .product-grid{         grid-template-columns:repeat(2,1fr);     }      .hero h1{         font-size:42px;     } }  @media(max-width:550px){     .product-grid{         grid-template-columns:1fr;     }      nav{         padding:15px 4%;     }      nav a{         margin-left:8px;         font-size:13px;     } } </style> </head>  <body>  <!-- NAVBAR --> <nav>     <div class="logo">         Rion <span>Shop</span>     </div>      <div>         <a href="#home">Home</a>         <a href="#products">Products</a>         <a href="#cart">Cart 🛒</a>     </div> </nav>   <!-- HERO --> <section class="hero" id="home">      <h1>Welcome to Rion Shop</h1>      <p>         Find your favorite products at the best price.     </p>      <a href="#products">         <button class="btn">Shop Now</button>     </a>  </section>   <!-- SEARCH --> <div class="search-area">      <input         type="text"         id="search"         placeholder="🔍 Search products..."         onkeyup="searchProducts()"     >  </div>   <!-- CATEGORY --> <div class="categories">      <button onclick="filterProducts('all')">         All     </button>      <button onclick="filterProducts('fashion')">         Fashion     </button>      <button onclick="filterProducts('phone')">         Phone     </button>      <button onclick="filterProducts('gaming')">         Gaming     </button>  </div>   <!-- PRODUCTS --> <section class="products" id="products">  <h2>Our Products</h2>  <div class="product-grid">      <div class="product" data-category="fashion">         <div class="product-img">🩲</div>          <div class="product-info">             <h3>Efaz er GF</h3>              <div class="price">                 ৳599             </div>              <button class="btn"                 onclick="addCart('Efaz er GF',599)">                 Add to Cart             </button>         </div>     </div>       <div class="product" data-category="phone">         <div class="product-img">📱</div>          <div class="product-info">             <h3>Tahhmid er GF</h3>              <div class="price">                 ৳18,999             </div>              <button class="btn"                 onclick="addCart('Tahmid er GF',18999)">                 Add to Cart             </butt
